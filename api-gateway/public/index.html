<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar | Liga UManizales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/futuro.css">
</head>
<body class="login">

  <!-- El logo de la Universidad de Manizales es el fondo de esta pantalla (img/logo-um.png) -->
  <div class="login-stage">
    <div class="lgrid"></div>
    <div class="lorb lo1"></div>
    <div class="lorb lo2"></div>
    <div class="logo-wrap"><img src="img/logo-um.png" alt="Universidad de Manizales — Un solo equipo y una misma pasión"></div>
    <div class="panel"></div>
    <div class="login-foot">Liga deportiva universitaria</div>
  </div>

  <div class="login-card">
    <h1>Liga <span>UManizales</span></h1>
    <p class="sub">Inscripción de equipos, torneos, resultados y tabla de posiciones.</p>

    <div class="login-tabs" id="tabs">
      <span class="slider"></span>
      <button type="button" id="tabLogin" class="active">Ingresar</button>
      <button type="button" id="tabRegistro">Crear cuenta de delegado</button>
    </div>

    <form id="loginForm">
      <label for="username">Usuario</label>
      <input type="text" id="username" required autocomplete="username" placeholder="tu usuario">

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">

      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="btn btn-gold">Ingresar</button>
    </form>

    <form id="registroForm" style="display:none;">
      <p class="hint">Si vas a inscribir un equipo, crea tu cuenta de <strong>delegado</strong> y luego completa el formulario de inscripción.</p>

      <label for="r_nombre">Nombre completo</label>
      <input type="text" id="r_nombre" required autocomplete="name">

      <label for="r_username">Usuario</label>
      <input type="text" id="r_username" required autocomplete="off" placeholder="ej: maria.lopez">

      <label for="r_password">Contraseña (mínimo 6 caracteres)</label>
      <input type="password" id="r_password" required autocomplete="new-password">

      <label for="r_password2">Repite la contraseña</label>
      <input type="password" id="r_password2" required autocomplete="new-password">

      <div class="error-msg" id="regError"></div>
      <button type="submit" class="btn btn-gold">Crear cuenta y entrar</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script>
    var loginForm = document.getElementById('loginForm');
    var registroForm = document.getElementById('registroForm');
    var tabs = document.getElementById('tabs');
    var tabLogin = document.getElementById('tabLogin');
    var tabRegistro = document.getElementById('tabRegistro');

    function mostrar(registro) {
      loginForm.style.display = registro ? 'none' : '';
      registroForm.style.display = registro ? '' : 'none';
      tabLogin.classList.toggle('active', !registro);
      tabRegistro.classList.toggle('active', registro);
      tabs.classList.toggle('reg', registro);
    }
    tabLogin.addEventListener('click', function () { mostrar(false); });
    tabRegistro.addEventListener('click', function () { mostrar(true); });

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      var errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';
      try {
        var data = await api.login(document.getElementById('username').value.trim(), document.getElementById('password').value);
        api.guardarSesion(data);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'No se pudo iniciar sesión';
      }
    });

    registroForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      var errorEl = document.getElementById('regError');
      errorEl.textContent = '';
      var username = document.getElementById('r_username').value.trim();
      var password = document.getElementById('r_password').value;
      if (password !== document.getElementById('r_password2').value) {
        errorEl.textContent = 'Las contraseñas no coinciden';
        return;
      }
      try {
        await api.registro({ nombre: document.getElementById('r_nombre').value.trim(), username: username, password: password });
        var data = await api.login(username, password);
        api.guardarSesion(data);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'No se pudo crear la cuenta';
      }
    });

    // Si ya hay sesión activa, entra directo al panel
    if (api.hasSession()) window.location.href = 'dashboard.html';
  </script>
</body>
</html>
